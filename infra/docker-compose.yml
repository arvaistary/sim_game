services:
  postgres:
    image: postgres:16-alpine
    container_name: game-life-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_life
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    ports:
      - "5432:5432"
    volumes:
      - game-life-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game_life"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  game-life-postgres-data:
